server {
    listen 80;
    root /usr/share/nginx/html;

    # Revalidate the entry page on every visit, including SPA fallback routes.
    # Otherwise a cached HTML document can keep loading an older hashed bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    # Vite fingerprints assets. Missing chunks must be a 404, not HTML.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Preserve extensionless public pages such as /privacy and SPA deep links.
    location / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri $uri.html /index.html;
    }
}
